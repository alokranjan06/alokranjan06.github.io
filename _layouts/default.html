<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">

  {% include mathjax.html %}

  {% include head.html %}

  <body>

    {% include header.html %}

    <main class="page-content" aria-label="Content">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>

    {% include footer.html %}

<div id="dark-mode-toggle" onclick="toggleDarkMode()" style="
  position: fixed;
  top: 15px;
  right: 15px;
  z-index: 9999;
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  background-color: #f0f0f0;
  border-radius: 20px;
  padding: 6px 12px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  font-family: Cambria, Georgia, serif;
  font-size: 13px;
  user-select: none;
">
  <span id="dark-mode-icon">🌙</span>
  <span id="dark-mode-label">Dark Mode</span>
</div>

    
<script>
function toggleDarkMode() {
  document.body.classList.toggle('dark-mode');
  const isDark = document.body.classList.contains('dark-mode');
  localStorage.setItem('darkMode', isDark ? 'enabled' : 'disabled');
  document.getElementById('dark-mode-icon').textContent = isDark ? '☀️' : '🌙';
  document.getElementById('dark-mode-label').textContent = isDark ? 'Light Mode' : 'Dark Mode';
}

window.addEventListener('DOMContentLoaded', () => {
  if (localStorage.getItem('darkMode') === 'enabled') {
    document.body.classList.add('dark-mode');
    document.getElementById('dark-mode-icon').textContent = '☀️';
    document.getElementById('dark-mode-label').textContent = 'Light Mode';
  }
});
</script>
    
</body>
  

    

  
</html>
